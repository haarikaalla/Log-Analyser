services:
  log-analyser:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LOG_ANALYZER_API_KEY: ${LOG_ANALYZER_API_KEY:?Set LOG_ANALYZER_API_KEY}
    volumes:
      - ./sample_logs:/app/sample_logs:ro
      - analysis-data:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  analysis-data:
